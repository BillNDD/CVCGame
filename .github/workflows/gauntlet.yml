# Runs the full testing gauntlet (docs/testing-gauntlet.md) at RELEASE time:
# publishing a release creates its v* tag, and that tag triggers this run - a
# recorded second opinion on the exact commit the release points at, after the
# owner's local gauntlet already came up green. It can also be started by hand
# from the Actions tab. Ordinary pushes run `npm run check` locally and the
# deploy workflow's test suite instead; the owner set this cadence on
# 2026-08-02 ("only at that occasion").
name: Gauntlet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app
      - name: Install the gate browser
        run: npx playwright install --with-deps chromium
      - name: Run the gauntlet
        run: npm run gauntlet
