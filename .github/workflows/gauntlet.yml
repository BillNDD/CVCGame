# Runs the full testing gauntlet (docs/testing-gauntlet.md) at RELEASE time:
# publishing a release creates its v* tag, and that tag triggers this run - a
# recorded second opinion on the exact commit the release points at, after the
# owner's local gauntlet already came up green. It can also be started by hand
# from the Actions tab. Ordinary pushes run `npm run check` locally and
# nothing else - the deploy workflow stopped running on push when the website
# moved to publishing releases only (2026-08-23), so it is no longer a second
# pair of eyes on a push. The owner set this cadence on 2026-08-02 ("only at
# that occasion").
name: Gauntlet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app
      # THREE ENGINES, because the gauntlet asks for three (2026-09-01, commit
      # ac50690): G7 and G8 and G18 and G30 each run again on WebKit, which is
      # the engine of every iPhone and iPad, and G8/G18/G30 on Firefox. The
      # runner installed chromium only, so the beta 31 tag's run went red on
      # five gates with "CENSUS_ENGINE=webkit was asked for and could not
      # launch" - a missing browser, not a defect, and the gates were right to
      # refuse rather than silently substitute one engine for another.
      - name: Install the gate browsers
        run: npx playwright install --with-deps chromium webkit firefox
      # G13 voice-edges is Python: it decodes every clip in the pack with PyAV
      # and measures its edges with NumPy. The runner ships neither, and every
      # tagged release's run was red on that one gate while the other 27 were
      # green (found 2026-08-22, reading the beta.23 and beta.24 runs). Pinned
      # to the versions the owner's machine measured the edges with, so the
      # second opinion decodes the same bytes the same way.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the voice-edge gate's decoder
        run: python3 -m pip install "av==18.1.0" "numpy==2.5.2"
      - name: Run the gauntlet
        run: npm run gauntlet
